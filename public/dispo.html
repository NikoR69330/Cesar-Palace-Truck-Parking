<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Disponibilités — Cesar Palace Truck Parking</title>
<style>
  :root{
    --bg:#14171a; --panel:#1c2024; --panel-2:#22262b; --line:#2a2f34;
    --text:#eae7e1; --text-dim:#8b9298; --text-faint:#5a6067;
    --amber:#00D4FF; --green:#35c47a; --red:#e8483c; --blue:#4aa3e0;
    --sans: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:16px;}
  .wrap{max-width:480px;margin:0 auto;padding-bottom:40px;}

  .lang-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
  .lang-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .lang-btn svg{border-radius:2px;flex-shrink:0;display:block;}
  .lang-btn.active{background:var(--amber);color:#00232b;border-color:var(--amber);}

  header{text-align:center;margin-bottom:20px;padding-top:8px;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:6px;}
  h1{margin:0;font-size:20px;font-weight:800;}
  .clock{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:6px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}

  .gauge-wrap{text-align:center;margin-bottom:10px;}
  .gauge-pct{font-family:var(--mono);font-size:44px;font-weight:800;color:var(--amber);}
  .gauge-lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
  .gauge-track{display:flex;gap:2px;height:16px;margin-top:14px;}
  .seg{flex:1;background:var(--panel-2);border-radius:2px;}
  .seg.on{background:var(--seg-color, var(--green));}

  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
  .stat .num{font-family:var(--mono);font-size:26px;font-weight:800;}
  .stat .num.free{color:var(--green);}
  .stat .num.occ{color:var(--red);}
  .stat .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

  .zone-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .zone-row b{color:var(--text);}

  .btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;background:var(--amber);color:#00232b;margin-top:4px;}
  .btn:hover{filter:brightness(1.08);}

  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  input, textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px;font-size:15px;margin-bottom:14px;font-family:var(--sans);
  }
  textarea{min-height:60px;resize:vertical;}
  input:focus, textarea:focus{outline:none;border-color:var(--amber);}

  .success-box{text-align:center;padding:20px 10px;}
  .success-box .icon{font-size:40px;margin-bottom:10px;}
  .success-box h3{margin:0 0 6px 0;font-size:17px;}
  .success-box p{color:var(--text-dim);font-size:13px;}

  .footnote{font-size:11px;color:var(--text-faint);text-align:center;margin-top:10px;}
  .sync{font-size:11px;color:var(--text-faint);text-align:center;margin-bottom:16px;}
  .err{color:var(--red);font-size:12px;margin-top:-8px;margin-bottom:10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-bar" id="langBar"></div>

  <header>
    <div class="eyebrow">Cesar Palace Truck Parking</div>
    <h1 id="txtTitle">🚛 Disponibilités en direct</h1>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="sync" id="syncLabel">…</div>

  <div class="card" id="checkCard">
    <h3 id="txtCheckTitle" style="margin:0 0 4px 0; font-size:16px;">🔍 Vérifier ma réservation</h3>
    <p id="txtCheckDesc" style="font-size:12px; color:var(--text-dim); margin:0 0 16px 0;"></p>
    <div style="display:flex; gap:8px;">
      <input id="checkPlateInput" placeholder="AB-123-CD" style="margin-bottom:0; flex:1;">
      <button class="btn" id="checkBtn" style="width:auto; margin-top:0; padding:12px 18px; white-space:nowrap;">Vérifier</button>
    </div>
    <div id="checkResult" style="margin-top:12px;"></div>
  </div>

  <div class="card" id="reserveCard">
    <h3 id="txtReserveTitle" style="margin:0 0 4px 0; font-size:16px;">📋 Demander une place</h3>
    <p id="txtReserveDesc" style="font-size:12px; color:var(--text-dim); margin:0 0 16px 0;"></p>
    <div id="reserveForm">
      <label id="txtLabelPlate">Immatriculation</label>
      <input id="plateInput" placeholder="AB-123-CD">
      <label id="txtLabelWhen">Date et heure d'arrivée prévues</label>
      <input id="whenInput" type="datetime-local">
      <label id="txtLabelPhone">Contact (téléphone)</label>
      <input id="phoneInput" placeholder="+33 6 12 34 56 78">
      <label id="txtLabelNote">Note (facultatif)</label>
      <textarea id="noteInput"></textarea>
      <div class="err" id="formErr"></div>
      <button class="btn" id="submitBtn">Envoyer la demande</button>
    </div>
  </div>

  <div class="footnote" id="txtFootnote">Les disponibilités se mettent à jour automatiquement.</div>
</div>

let currentLang = 'fr';

function detectLang(){
  const saved = localStorage.getItem('dispoLang');
  if(saved && T[saved]) return saved;
  const nav = (navigator.language || 'fr').slice(0,2).toLowerCase();
  return T[nav] ? nav : 'fr';
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el) el.textContent = value;
}

function applyLang(lang){
  currentLang = T[lang] ? lang : 'fr';
  localStorage.setItem('dispoLang', currentLang);
  const t = T[currentLang];
  document.documentElement.lang = currentLang;
  setText('txtTitle', t.title);
  setText('txtOccupation', t.occupation);
  setText('txtFree', t.free);
  setText('txtOcc', t.occ);
  setText('txtZoneFrigo', t.zoneFrigo);
  setText('txtZoneStd', t.zoneStd);
  setText('txtReserveTitle', t.reserveTitle);
  setText('txtReserveDesc', t.reserveDesc);
  setText('txtLabelPlate', t.labelPlate);
  setText('txtLabelWhen', t.labelWhen);
  setText('txtLabelPhone', t.labelPhone);
  setText('txtLabelNote', t.labelNote);
  setText('txtFullTitle', t.fullTitle);
  setText('txtFullDesc', t.fullDesc);
  setText('txtCheckTitle', t.checkTitle);
  setText('txtCheckDesc', t.checkDesc);
  setText('txtFootnote', t.footnote);
  const checkBtnEl = document.getElementById('checkBtn');
  if(checkBtnEl) checkBtnEl.textContent = t.checkBtn;
  const noteEl = document.getElementById('noteInput');
  if(noteEl) noteEl.placeholder = t.notePlaceholder;
  const submitEl = document.getElementById('submitBtn');
  if(submitEl) submitEl.textContent = t.submit;
  renderLangBar();
  refreshLabelsOnly();
}

function renderLangBar(){
  const bar = document.getElementById('langBar');
  bar.innerHTML = LANGS.map(l =>
    `<button class="lang-btn ${l.code===currentLang?'active':''}" data-lang="${l.code}">${SVG_FLAGS[l.code]}<span>${l.label}</span></button>`
  ).join('');
  bar.querySelectorAll('[data-lang]').forEach(btn=>{
    btn.onclick = () => applyLang(btn.dataset.lang);
  });
}

/* ---------- logique disponibilité / réservation ---------- */
const REQUESTS_KEY = 'requests';
const PREBOOKINGS_KEY = 'prebookings';

function isFrigoZone(id){ const n = parseInt(id, 10); return String(n) === id && n >= 1 && n <= 22; }

async function loadKey(type, fallback){
  try{
    const res = await fetch(`/api/data?type=${type}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data.value === null || data.value === undefined) ? fallback : data.value;
  }catch(e){ return fallback; }
}
async function saveKey(type, value){
  try{
    const res = await fetch(`/api/data?type=${type}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({value})
    });
    return res.ok;
  }catch(e){ return false; }
}

function tickClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString(currentLang); }

let lastFree = null, lastOcc = null, lastFrigoTxt = null, lastStdTxt = null;

function refreshLabelsOnly(){
  // Ré-applique juste les libellés déjà calculés (utile après un changement de langue sans re-fetch)
  const t = T[currentLang];
  if(lastFrigoTxt !== null) document.getElementById('zoneFrigo').textContent = lastFrigoTxt;
  if(lastStdTxt !== null) document.getElementById('zoneStd').textContent = lastStdTxt;
}

let wasFullState = null;

async function refresh(){
  const t = T[currentLang];
  const isFull = await loadKey('forceFull', false);
  if(isFull !== wasFullState){
    wasFullState = isFull;
    const reserveCard = document.getElementById('reserveCard');
    if(isFull){
      reserveCard.innerHTML = `
        <div style="text-align:center; padding:10px 4px;">
          <h3 id="txtFullTitle" style="margin:0 0 8px 0; font-size:18px; color:var(--red);">${t.fullTitle}</h3>
          <p id="txtFullDesc" style="font-size:13px; color:var(--text-dim); margin:0;">${t.fullDesc}</p>
        </div>`;
    }else{
      reserveCard.innerHTML = `
        <h3 id="txtReserveTitle" style="margin:0 0 4px 0; font-size:16px;">${t.reserveTitle}</h3>
        <p id="txtReserveDesc" style="font-size:12px; color:var(--text-dim); margin:0 0 16px 0;">${t.reserveDesc}</p>
        <div id="reserveForm">
          <label id="txtLabelPlate">${t.labelPlate}</label>
          <input id="plateInput" placeholder="AB-123-CD">
          <label id="txtLabelWhen">${t.labelWhen}</label>
          <input id="whenInput" type="datetime-local">
          <label id="txtLabelPhone">${t.labelPhone}</label>
          <input id="phoneInput" placeholder="+33 6 12 34 56 78">
          <label id="txtLabelNote">${t.labelNote}</label>
          <textarea id="noteInput" placeholder="${t.notePlaceholder}"></textarea>
          <div class="err" id="formErr"></div>
          <button class="btn" id="submitBtn">${t.submit}</button>
        </div>`;
      attachSubmitHandler();
    }
  }
  document.getElementById('syncLabel').textContent = t.updatedAt(new Date().toLocaleTimeString(currentLang));
}

function attachSubmitHandler(){
  const submitBtn = document.getElementById('submitBtn');
  if(!submitBtn) return;
  const whenEl = document.getElementById('whenInput');
  if(whenEl){
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    whenEl.min = now.toISOString().slice(0,16);
  }
  submitBtn.onclick = async () => {
    const t = T[currentLang];
    const plate = document.getElementById('plateInput').value.trim();
    const when = document.getElementById('whenInput').value; // format "YYYY-MM-DDTHH:MM"
    const phone = document.getElementById('phoneInput').value.trim();
    const note = document.getElementById('noteInput').value.trim();
    const errEl = document.getElementById('formErr');
    errEl.style.display = 'none';
    if(!plate || !phone || !when){
      errEl.textContent = t.errMissing;
      errEl.style.display = 'block';
      return;
    }
    const [datePart, timePart] = when.split('T');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = t.sending;
    try{
      // Écrit directement dans "prebookings" — même liste que celle utilisée
      // côté équipe (index.html) : c'est une vraie réservation confirmée,
      // pas juste une demande à valider. Elle apparaît immédiatement dans
      // "Pré-réservations" côté opérateur, et devient trouvable via
      // "Vérifier ma réservation".
      const existing = await loadKey(PREBOOKINGS_KEY, []);
      const updated = [...existing, {
        id: 'pb_' + Date.now(),
        plate: plate.toUpperCase(),
        date: datePart,
        time: timePart || null,
        category: null,
        phone,
        note,
        status: 'pending',
        lang: currentLang,
        createdBy: 'chauffeur (public)',
        createdAt: new Date().toISOString()
      }];
      const ok = await saveKey(PREBOOKINGS_KEY, updated);
      if(!ok) throw new Error('save failed');
      document.getElementById('reserveCard').innerHTML = `
        <div class="success-box">
          <div class="icon">✅</div>
          <h3>${t.successTitle}</h3>
          <p>${t.successDesc(plate.toUpperCase())}</p>
        </div>`;
    }catch(e){
      btn.disabled = false; btn.textContent = t.submit;
      errEl.textContent = t.errNetwork;
      errEl.style.display = 'block';
    }
  };
}
attachSubmitHandler();

document.getElementById('checkBtn').onclick = async () => {
  const t = T[currentLang];
  const plate = document.getElementById('checkPlateInput').value.trim().toUpperCase();
  const resultEl = document.getElementById('checkResult');
  if(!plate){
    resultEl.innerHTML = `<div class="err" style="display:block;">${t.checkEmpty}</div>`;
    return;
  }
  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.textContent = t.checkChecking;
  resultEl.innerHTML = '';
  try{
    const prebookings = await loadKey('prebookings', []);
    const matches = prebookings.filter(p => p.plate === plate && p.status !== 'cancelled');
    matches.sort((a,b) => new Date(b.date) - new Date(a.date));
    const match = matches[0];
    if(match){
      const dateStr = new Date(match.date).toLocaleDateString(currentLang);
      const msg = match.status === 'arrived'
        ? t.checkFoundArrived
        : t.checkFoundPending(dateStr, match.time || '');
      resultEl.innerHTML = `<div style="background:rgba(53,196,122,0.1); border:1px solid var(--green); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--green);">${msg}</div>`;
    }else{
      resultEl.innerHTML = `<div style="background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--text-dim);">${t.checkNotFound}</div>`;
    }
  }catch(e){
    resultEl.innerHTML = `<div class="err" style="display:block;">${t.errNetwork}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = t.checkBtn;
  }
};
document.getElementById('checkPlateInput').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('checkBtn').click(); });

applyLang(detectLang());
tickClock();
setInterval(tickClock, 1000);
refresh();
setInterval(refresh, 8000);
</script>
